[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar10-zero-shot-clip"
version = "0.1.0"
description = "Reproducible zero-shot CIFAR-10 classification with CLIP prompt ensembling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai-clip @ git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33",
  "pandas>=2.1",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
cifar10-clip-evaluate = "cifar10_clip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

